name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # mint refuses Node below 20.17 at run time.
          node-version: '20'
      - run: npm install -g mint
      - run: mint validate
      - run: mint broken-links
